<!DOCTYPE html>
<html>
  <head>
    <base href="./" />
    <meta charset="utf-8" />
    <title>星际保卫者 · 离线版</title>
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-page-mode" content="app" />
    <link rel="stylesheet" type="text/css" href="style-mobile.72876.css" />
    <style>
      /* 更新日志面板样式内联在入口文档中：即使外链 CSS 命中旧缓存，公告也能正确显示 */
      .update-log {
        position: absolute;
        top: 8%;
        left: 50%;
        width: min(78vw, 560px);
        max-height: 28vh;
        transform: translateX(-50%);
        box-sizing: border-box;
        padding: 14px 18px 12px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        background: rgba(8, 12, 24, 0.72);
        color: #fff;
        text-align: left;
        font-family: Helvetica, Verdana, Arial, sans-serif;
        z-index: 2;
      }
      .update-log h1 {
        margin: 0 0 8px;
        color: #fff;
        font-size: clamp(16px, 3.8vw, 22px);
        font-weight: 700;
      }
      .update-log-scroll {
        max-height: calc(28vh - 58px);
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-color: rgba(255, 255, 255, 0.55) transparent;
      }
      .update-entry {
        margin: 0;
        color: #fff;
        font-size: clamp(13px, 3.2vw, 17px);
        line-height: 1.65;
      }
      .update-entry h2 {
        margin: 0 0 2px;
        color: #fff;
        font-size: 1em;
        font-weight: 700;
      }
      .update-entry p {
        margin: 0;
        color: #fff;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      @media (orientation: landscape) and (min-width: 700px) {
        .update-log {
          top: 6%;
          left: 8%;
          width: min(36vw, 560px);
          transform: none;
        }
      }
    </style>
    <link rel="icon" href="favicon.8de18.ico" />
  </head>
  <body>
    <script src="config/game-config.js"></script>
    <script src="offline.js?v=redeem-1"></script>
    <script src="offline-redeem.js?v=redeem-1"></script>
    <script src="config/arena-bots.js"></script>
    <script src="offline-arena.js?v=balance20261009"></script>
    <script src="offline-fortress.js?v=balance20261009"></script>
    <script src="offline-daily.js?v=balance20261009"></script>
    <script src="offline-building-sale.js?v=construction-sale-2"></script>
    <script src="offline-battle-rules.js?v=balance20261009"></script>
    <script src="offline-all-choice.js?v=balance20261009"></script>
    <script src="combat-packs.js?v=balance20261009"></script>
    <script src="offline-resource-packs.js?v=balance20261009"></script>
    <script src="offline-battle-load.js?v=balance20261009"></script>
    <script src="offline-sweep.js?v=balance20261009"></script>
    <canvas
      id="GameCanvas"
      oncontextmenu="event.preventDefault()"
      tabindex="0"
    ></canvas>
    <div id="splash">
      <div class="progress-bar stripes">
        <span style="width: 0%"></span>
      </div>
      <section class="update-log" aria-label="更新日志">
        <h1>更新日志</h1>
        <div class="update-log-scroll">
          <article class="update-entry">
            <h2>10月10日</h2>
            <p>21关后敌方强度成长提升至每关1.25</p>
            <p>竞技场胜负结算后提示获得的科技星核</p>
            <p>商店免费领取同步到账，快速连点不再丢失</p>
            <p>扫荡奖励提示到期自动消失</p>
            <p>资源包下载与解压流水并行，进度分别显示</p>
          </article>
          <article class="update-entry">
            <h2>10月9日</h2>
            <p>21关后敌方强度成长由每关1.01上调至每关1.016</p>
          </article>
          <article class="update-entry">
            <h2>10月7日</h2>
            <p>已造好的建筑可以100晶体矿出售</p>
            <p>20关后难度下调</p>
          </article>
        </div>
      </section>
    </div>
    <script src="src/settings.balance20261009.js?v=balance20261009" charset="utf-8"></script>
    <script src="main.4295f.js" charset="utf-8"></script>
    <script type="text/javascript">
      (function () {
        // open web debugger console
        if (typeof VConsole !== "undefined") {
          window.vConsole = new VConsole();
        }

        var debug = window._CCSettings.debug;
        var splash = document.getElementById("splash");
        splash.style.display = "block";

        function loadScript(moduleName, cb) {
          function scriptLoaded() {
            document.body.removeChild(domScript);
            domScript.removeEventListener("load", scriptLoaded, false);
            cb && cb();
          }
          var domScript = document.createElement("script");
          domScript.async = true;
          domScript.src = moduleName;
          domScript.addEventListener("load", scriptLoaded, false);
          document.body.appendChild(domScript);
        }

        loadScript(
          debug ? "cocos2d-js.js" : "cocos2d-js-min.1b8ff.js",
          function () {
            if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
              loadScript(debug ? "physics.js" : "physics-min.js", window.boot);
            } else {
              window.boot();
            }
          },
        );
      })();
    </script>
  </body>
</html>
